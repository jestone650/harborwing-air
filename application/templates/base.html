<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HarborWing Air{% endblock %} · HarborWing Air</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('home') }}">HarborWing Air</a>
  <nav>
    {% for key, e in nav.items() %}<a href="{{ url_for('list_view', name=key) }}">{{ e.title }}</a>{% endfor %}
    <a href="{{ url_for('reference') }}">Reference</a>
    <a href="{{ url_for('calendar') }}">Calendar</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
